version: '3.8'

services:
  app:
    builds: .
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=mongodb://mongodb:27017/user-accounts
    
    mongodb:
      image: mongodb:9.0
      ports:
      - "27017:27017"
      volumes:
      - mongo_data: /data/db
    
    mongo-express:
      image: mongo-express:1.0-alpine
      ports:
        - "8081:8081"
      depends_on:
        - mongodb
      environment:
        - ME_CONFIG_MONGODB_SERVER=mongodb
        - ME_CONFIG_MONGODB_PORT=27017

volumes:
  mongo_data: